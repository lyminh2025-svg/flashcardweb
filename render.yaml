services:
  - type: web
    name: flashcard
    runtime: docker
    plan: free
    healthCheckPath: /api/me
    envVars:
      - key: DATA_DIR
        value: /data
      - key: SECURE_COOKIE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
